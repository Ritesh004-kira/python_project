{% extends "base.html" %}
{% block title %}Create Account — CineAI{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo"><i class="fas fa-film"></i> CineAI</div>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-sub">Join CineAI and discover movies made for your taste.</p>

        <form method="POST" class="auth-form">
            <div class="form-group">
                <label><i class="fas fa-user"></i> Full Name</label>
                <input type="text" name="name" required placeholder="Your name" class="form-input">
            </div>
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Email</label>
                <input type="email" name="email" required placeholder="you@example.com" class="form-input">
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <input type="password" name="password" required placeholder="Min. 6 characters" class="form-input" minlength="6">
            </div>
            <button type="submit" class="btn-play" style="width:100%;justify-content:center;">
                <i class="fas fa-user-plus"></i> Create Account
            </button>
        </form>

        <p class="auth-switch">
            Already have an account? <a href="{{ url_for('auth.login') }}">Log In</a>
        </p>
    </div>
</div>
{% endblock %}
